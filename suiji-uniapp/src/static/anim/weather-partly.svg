<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="多云">
<style>
  .bob{animation:pbob 3.2s ease-in-out infinite;transform-origin:70px 70px}
  @keyframes pbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .sun{animation:spin 10s linear infinite;transform-origin:92px 52px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .drift{animation:drift 3s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
</style>
<g class="bob">
  <g class="sun">
    <line x1="92" y1="24" x2="92" y2="32" stroke="#F5B32C" stroke-width="5" stroke-linecap="round"/>
    <line x1="64" y1="52" x2="72" y2="52" stroke="#F5B32C" stroke-width="5" stroke-linecap="round"/>
    <line x1="72" y1="32" x2="78" y2="38" stroke="#F5B32C" stroke-width="5" stroke-linecap="round"/>
    <line x1="112" y1="32" x2="106" y2="38" stroke="#F5B32C" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="92" cy="52" r="20" fill="#FFD85C" stroke="#D9911B" stroke-width="4.5"/>
  <g class="drift">
    <path d="M44 96 a18 18 0 0 1 3-35 23 23 0 0 1 43 6 16 16 0 0 1 8 29 Z" fill="#FFF6EA" stroke="#5B4232" stroke-width="4.5" stroke-linejoin="round"/>
    <g class="eyes">
      <circle cx="58" cy="78" r="4.6" fill="#4A3226"/><circle cx="76" cy="78" r="4.6" fill="#4A3226"/>
      <circle cx="56.5" cy="76.4" r="1.5" fill="#FFFFFF"/><circle cx="74.5" cy="76.4" r="1.5" fill="#FFFFFF"/>
    </g>
    <path d="M62 86 q5 5 10 0" stroke="#4A3226" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="50" cy="85" rx="5.5" ry="3.2" fill="#F9A8B8" opacity=".9"/>
    <ellipse cx="84" cy="85" rx="5.5" ry="3.2" fill="#F9A8B8" opacity=".9"/>
  </g>
</g>
</svg>
