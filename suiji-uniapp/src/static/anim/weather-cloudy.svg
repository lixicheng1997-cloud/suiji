<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="阴">
<style>
  .bob{animation:cbob 3.4s ease-in-out infinite;transform-origin:70px 70px}
  @keyframes cbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .cBack{animation:driftB 3.6s ease-in-out infinite}
  @keyframes driftB{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
  .cFront{animation:driftF 3.6s ease-in-out infinite}
  @keyframes driftF{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
</style>
<g class="bob">
  <g class="cBack">
    <path d="M66 58 a15 15 0 0 1 3-29 19 19 0 0 1 35 5 13 13 0 0 1 7 24 Z" fill="#EDE6DA" stroke="#8A7466" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <g class="cFront">
    <path d="M40 100 a18 18 0 0 1 3-35 23 23 0 0 1 43 6 16 16 0 0 1 8 29 Z" fill="#FFF6EA" stroke="#5B4232" stroke-width="4.5" stroke-linejoin="round"/>
    <g class="eyes">
      <circle cx="56" cy="82" r="4.6" fill="#4A3226"/><circle cx="72" cy="82" r="4.6" fill="#4A3226"/>
      <circle cx="54.5" cy="80.4" r="1.5" fill="#FFFFFF"/><circle cx="70.5" cy="80.4" r="1.5" fill="#FFFFFF"/>
    </g>
    <path d="M60 90 q4 4 8 0" stroke="#4A3226" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="48" cy="88" rx="5.5" ry="3.2" fill="#F9A8B8" opacity=".85"/>
    <ellipse cx="80" cy="88" rx="5.5" ry="3.2" fill="#F9A8B8" opacity=".85"/>
  </g>
</g>
</svg>
