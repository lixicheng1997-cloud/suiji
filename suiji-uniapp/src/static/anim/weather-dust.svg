<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="沙尘">
<style>
  .bob{animation:dbob 3.4s ease-in-out infinite;transform-origin:70px 60px}
  @keyframes dbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .grain{animation:grain 2.2s linear infinite}
  .g2{animation-delay:.7s}
  .g3{animation-delay:1.4s}
  @keyframes grain{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}80%{opacity:.9}100%{transform:translate(18px,20px);opacity:0}}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
</style>
<g class="bob">
  <path d="M42 62 a18 18 0 0 1 3-35 23 23 0 0 1 43 6 16 16 0 0 1 8 29 Z" fill="#E8C07A" stroke="#A97E45" stroke-width="4.5" stroke-linejoin="round"/>
  <g class="eyes">
    <circle cx="60" cy="50" r="4.6" fill="#4A3226"/><circle cx="76" cy="50" r="4.6" fill="#4A3226"/>
    <circle cx="58.5" cy="48.4" r="1.5" fill="#FFFFFF"/><circle cx="74.5" cy="48.4" r="1.5" fill="#FFFFFF"/>
  </g>
  <path d="M64 58 q4 4 8 0" stroke="#4A3226" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <ellipse cx="52" cy="56" rx="5.5" ry="3.2" fill="#F9A8B8" opacity=".8"/>
  <ellipse cx="84" cy="56" rx="5.5" ry="3.2" fill="#F9A8B8" opacity=".8"/>
  <g class="grain"><circle cx="46" cy="86" r="4.5" fill="#D9A066"/></g>
  <g class="grain g2"><circle cx="70" cy="88" r="4.5" fill="#D9A066"/></g>
  <g class="grain g3"><circle cx="92" cy="86" r="4.5" fill="#D9A066"/></g>
</g>
</svg>
