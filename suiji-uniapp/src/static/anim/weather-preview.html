<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>天气动效预览</title>
<style>
  body{margin:0;padding:24px;background:#FFF7EE;font-family:-apple-system,"PingFang SC",sans-serif;color:#5B4636}
  h2{font-size:16px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:640px}
  .cell{background:linear-gradient(135deg,#FFE8DB,#FFF2DE);border:2px solid #FFDCC0;border-radius:20px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .cell img{width:88px;height:88px}
  .cell .label{font-size:14px;font-weight:700}
  .cell .type{font-size:11px;color:#B9A896}
</style>
</head>
<body>
<h2>天气卡通动效预览（9 类）</h2>
<div class="grid" id="grid"></div>
<script>
  const items = [
    ['sun','晴'], ['partly','多云'], ['cloudy','阴'], ['fog','雾 / 霾'],
    ['rain','雨'], ['thunder','雷阵雨'], ['snow','雪'], ['sleet','雨夹雪'], ['dust','沙尘']
  ];
  const g = document.getElementById('grid');
  items.forEach(([t, label]) => {
    const c = document.createElement('div'); c.className = 'cell';
    c.innerHTML = `<img src="./weather-${t}.svg" /><div class="label">${label}</div><div class="type">${t}</div>`;
    g.appendChild(c);
  });
</script>
</body>
</html>
