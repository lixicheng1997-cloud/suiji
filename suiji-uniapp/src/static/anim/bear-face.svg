<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="小熊岁岁">
<style>
  .m-float{animation:breathe 3.2s ease-in-out infinite;transform-origin:70px 100px}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
</style>
<g class="m-float">
  <g class="ear"><circle cx="34" cy="38" r="20" fill="#D99E63" stroke="#6B4A3A" stroke-width="5"/><circle cx="34" cy="38" r="9" fill="#F7B8C4"/></g>
  <g class="ear"><circle cx="106" cy="38" r="20" fill="#D99E63" stroke="#6B4A3A" stroke-width="5"/><circle cx="106" cy="38" r="9" fill="#F7B8C4"/></g>
  <circle cx="70" cy="80" r="47" fill="#D99E63" stroke="#6B4A3A" stroke-width="5"/>
  <ellipse cx="70" cy="94" rx="22" ry="16" fill="#F7E3C8"/>
  <g class="eyes"><circle cx="52" cy="72" r="5.5" fill="#4A3226"/><circle cx="88" cy="72" r="5.5" fill="#4A3226"/></g>
  <ellipse cx="70" cy="88" rx="7" ry="5" fill="#6B4A3A"/>
  <path d="M70 93 q0 6 -7 7 M70 93 q0 6 7 7" stroke="#6B4A3A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="38" cy="86" rx="8" ry="5" fill="#F9A8B8" opacity=".85"/>
  <ellipse cx="102" cy="86" rx="8" ry="5" fill="#F9A8B8" opacity=".85"/>
</g>
</svg>
