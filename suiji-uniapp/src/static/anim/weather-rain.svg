<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="雨">
<style>
  .bob{animation:rbob 3.2s ease-in-out infinite;transform-origin:70px 60px}
  @keyframes rbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .drop{animation:drop 1.6s linear infinite}
  .d2{animation-delay:.55s}
  .d3{animation-delay:1.1s}
  @keyframes drop{0%{transform:translateY(0);opacity:0}15%{opacity:1}75%{opacity:1}100%{transform:translateY(30px);opacity:0}}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
</style>
<g class="bob">
  <path d="M42 62 a18 18 0 0 1 3-35 23 23 0 0 1 43 6 16 16 0 0 1 8 29 Z" fill="#FFF6EA" stroke="#5B4232" stroke-width="4.5" stroke-linejoin="round"/>
  <g class="eyes">
    <circle cx="60" cy="50" r="4.6" fill="#4A3226"/><circle cx="76" cy="50" r="4.6" fill="#4A3226"/>
    <circle cx="58.5" cy="48.4" r="1.5" fill="#FFFFFF"/><circle cx="74.5" cy="48.4" r="1.5" fill="#FFFFFF"/>
  </g>
  <path d="M64 58 q4 4 8 0" stroke="#4A3226" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <ellipse cx="52" cy="56" rx="5.5" ry="3.2" fill="#F9A8B8" opacity=".9"/>
  <ellipse cx="84" cy="56" rx="5.5" ry="3.2" fill="#F9A8B8" opacity=".9"/>
  <g class="drop"><path d="M0 0 C-4 7 -4 11 0 15 C4 11 4 7 0 0Z" fill="#5FA8DC" transform="translate(50,82)"/></g>
  <g class="drop d2"><path d="M0 0 C-4 7 -4 11 0 15 C4 11 4 7 0 0Z" fill="#5FA8DC" transform="translate(70,82)"/></g>
  <g class="drop d3"><path d="M0 0 C-4 7 -4 11 0 15 C4 11 4 7 0 0Z" fill="#5FA8DC" transform="translate(90,82)"/></g>
</g>
</svg>
