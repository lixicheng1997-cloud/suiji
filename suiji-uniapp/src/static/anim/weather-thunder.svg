<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="雷阵雨">
<style>
  .bob{animation:tbob 3.2s ease-in-out infinite;transform-origin:70px 60px}
  @keyframes tbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .bolt{animation:flash 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes flash{0%,55%,100%{opacity:.25}62%{opacity:1}70%{opacity:.3}78%{opacity:1}}
  .drop{animation:drop 1.5s linear infinite}
  .d2{animation-delay:.75s}
  @keyframes drop{0%{transform:translateY(0);opacity:0}15%{opacity:1}75%{opacity:1}100%{transform:translateY(26px);opacity:0}}
</style>
<g class="bob">
  <path d="M42 60 a18 18 0 0 1 3-35 23 23 0 0 1 43 6 16 16 0 0 1 8 29 Z" fill="#E7DFD2" stroke="#5B4232" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M56 50 q4 -4 8 0" stroke="#4A3226" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M72 50 q4 -4 8 0" stroke="#4A3226" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <ellipse cx="68" cy="58" rx="3.4" ry="2.8" fill="#4A3226"/>
  <path class="bolt" d="M72 74 L60 96 L70 96 L62 116 L84 90 L73 90 L81 74 Z" fill="#FFD85C" stroke="#D9911B" stroke-width="3" stroke-linejoin="round"/>
  <g class="drop"><path d="M0 0 C-3.5 6 -3.5 10 0 13 C3.5 10 3.5 6 0 0Z" fill="#5FA8DC" transform="translate(46,80)"/></g>
  <g class="drop d2"><path d="M0 0 C-3.5 6 -3.5 10 0 13 C3.5 10 3.5 6 0 0Z" fill="#5FA8DC" transform="translate(94,80)"/></g>
</g>
</svg>
