<g transform="translate(70,20)"><ellipse class="s s3" cy="6" rx="7" ry="2" fill="#6B4A3A"/><g class="h h3"><path d="M0 -10.5C3.6 -4.6 6.4 -1.6 6.4 1.6A6.4 6.4 0 1 1 -6.4 1.6C-6.4 -1.6 -3.6 -4.6 0 -10.5Z" fill="#F7A15C" stroke="#E07E33" stroke-width="2" stroke-linejoin="round"/></g></g>
