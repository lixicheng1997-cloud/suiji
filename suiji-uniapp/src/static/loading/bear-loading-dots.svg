<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 30" role="img" aria-label="小熊岁岁 · 加载中">
<style>
  .h{animation:hop .96s cubic-bezier(.34,1.56,.64,1) infinite}
  .h2{animation-delay:.16s}.h3{animation-delay:.32s}
  @keyframes hop{0%,58%,100%{transform:translateY(0)}24%{transform:translateY(-10px)}}
  .s{transform-box:fill-box;transform-origin:center;animation:sh .96s ease-in-out infinite}
  .s2{animation-delay:.16s}.s3{animation-delay:.32s}
  @keyframes sh{0%,58%,100%{transform:scaleX(1);opacity:.16}24%{transform:scaleX(.6);opacity:.07}}
  @media (prefers-reduced-motion:reduce){.h,.s{animation:none}}
</style>
