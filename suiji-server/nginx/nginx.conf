# 岁记服务端 nginx 主配置（docker-compose 的 nginx 服务以只读方式挂载到 /etc/nginx/nginx.conf）
user  nginx;
worker_processes  auto;

# 日志走 stdout/stderr，便于 docker logs / compose logs 直接查看
error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志脱敏：媒体下载为兼容 <img src>/<video src> 直连而在 query 里带 token，
    # 原样记录等于把用户令牌写进日志文件（docker logs 可被运维/日志平台广泛读取）。
    # 这里把 token / sig / 签名类参数的值统一替换为 ***，只保留参数名便于排障。
    # (?i) 让参数名大小写不敏感：MinIO 预签名用的是 X-Amz-Signature / X-Amz-Credential /
    # X-Amz-Security-Token，漏掉这几个等于把「绕过 JWT 的对象存储直连凭据」写进日志。
    map $args $safe_args {
        default                                             $args;
        # 非首个参数：前置分隔符保证只匹配完整参数名
        "~(?i)^(?<h1>.*[&;])(?<k>token|sig|signature|access_token|x-amz-signature|x-amz-credential|x-amz-security-token)=[^&]*(?<t1>.*)$"
                                                            $h1$k=***$t1;
        # 首个参数（前面没有 &）
        "~(?i)^(?<k>token|sig|signature|access_token|x-amz-signature|x-amz-credential|x-amz-security-token)=[^&]*(?<t1>.*)$"
                                                            $k=***$t1;
    }

    # Referer 同样可能带着 token（从带 ?token= 的页面跳过来时会原样带上）
    map $http_referer $safe_referer {
        default                                             $http_referer;
        "~(?i)^(?<r1>.*[?&])(?<k>token|sig|signature|access_token|x-amz-signature|x-amz-credential|x-amz-security-token)=[^&]*(?<r2>.*)$"
                                                            $r1$k=***$r2;
    }

    # 无 query 时不留多余的 ?
    map $args $quest {
        default   "?";
        ""        "";
    }

    # $request 含原始 query（会泄露令牌），故用 $uri + 脱敏后的 $safe_args 重组请求行
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri'
                      '$quest$safe_args $server_protocol" '
                      '$status $body_bytes_sent "$safe_referer" "$http_user_agent" '
                      'rt=$request_time urt=$upstream_response_time';
    access_log  /dev/stdout  main;

    # ---- 限流：没有它，登录/注册可被无限撞库，上传可打满带宽 ----
    # 认证相关（注册/登录/刷新/邀请码加入）：按分钟计，挡爆破
    limit_req_zone  $binary_remote_addr  zone=auth_limit:10m   rate=20r/m;
    # 业务接口与上传：按秒计，主要防脚本刷接口与带宽滥用
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m    rate=30r/s;
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;
    # 超限记 warn 而非默认 error，避免刷爆错误日志
    limit_req_status  429;
    limit_conn_status 429;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # http 级兜底值：server 块中的 NGINX_CLIENT_MAX_BODY_SIZE（模板注入）会覆盖它，
    # 两者需与 FILE_MAX_BYTES（默认 209715200 = 200MB）对齐，否则 nginx 默认 1m 会让上传直接 413
    client_max_body_size 200m;
    # 上传大文件（/api/v1/files）时先缓冲再落临时盘会拖慢，仅在超过缓冲区时才落盘
    client_body_buffer_size  1m;
    client_body_timeout      300s;
    client_header_timeout    60s;

    # MinIO 图片反代缓存：10MB 共享内存索引，磁盘缓存上限 500MB
    # 图片内容不可变，缓存命中率高；预签名 URL 每次签名不同，proxy_cache_key 含 $request_uri（含完整 query）
    proxy_cache_path /var/cache/nginx/minio levels=1:2 keys_zone=minio_cache:10m max_size=500m inactive=7d use_temp_path=off;

    # 接口以 JSON 为主，压缩收益明显；大文件（图片/视频）本身已压缩，不列入 gzip_types
    gzip  on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
