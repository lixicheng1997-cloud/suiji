# 岁记服务端编排 —— 公共底座（base）：db=postgres:16 + redis=redis:7-alpine + minio + api + nginx
#
# 本文件只放「开发 / 生产完全一致」的服务定义、健康检查、日志轮转与默认环境变量；
# 环境差异由两个覆盖文件承接，启动时显式叠加：
#
#   开发：docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up -d
#   生产：docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d
#
# 凭据（POSTGRES_PASSWORD / REDIS_PASSWORD / MINIO_ROOT_PASSWORD / MINIO_SECRET_KEY / JWT_SECRET）
# 一律用 ${VAR:?错误提示} 声明为必填——缺失时 compose 直接报错，不会退化成公开弱密码。
# 所有持久化数据统一挂在公共目录 DATA_DIR（默认 ./data）下，方便备份/迁移。
#
# 端口约定：形如 "${宿主端口}:${容器端口}"，容器端口固定（db 5432 / redis 6379 / minio 9000,9001 /
# api 8000），宿主端口可改；nginx 容器端口由 NGINX_LISTEN_PORT 决定，宿主侧由 NGINX_PORT 决定。
# 除 nginx 外一律只绑 127.0.0.1：数据库、对象存储、api 直连端口都不该被公网触达。

# 日志轮转：不限制的话 Docker 默认 json-file 会无限增长，直到把磁盘写满
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suiji}
      # 无兜底默认值：缺配置时直接拒绝启动，杜绝用 "suiji" 这类公开弱密码起库。
      # 注意 POSTGRES_PASSWORD 仅在数据目录为空（首次初始化）时生效；已有库改密码须 ALTER USER。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?未设置 POSTGRES_PASSWORD —— 请在环境 env 文件中配置强随机密码}
      POSTGRES_DB: ${POSTGRES_DB:-suiji}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suiji} -d ${POSTGRES_DB:-suiji}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    # 端口只绑 127.0.0.1：仅供宿主机上的图形客户端连，局域网与公网都访问不到。
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?未设置 REDIS_PASSWORD —— 请在环境 env 文件中配置强随机密码}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - "${DATA_DIR:-./data}/redis:/data"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?未设置 REDIS_PASSWORD —— 请在环境 env 文件中配置强随机密码}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 非结构化文件（图片/附件）对象存储：兼容 S3 协议
  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-suiji}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?未设置 MINIO_ROOT_PASSWORD —— 请在环境 env 文件中配置强随机密码}
      MINIO_DOMAIN: ${MINIO_DOMAIN:-}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - "${DATA_DIR:-./data}/minio:/data"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 可选：随 Compose 启动自动创建桶（默认 api 侧也会自动创建，可省略）。
  # 默认放入 init profile，需要手动建桶时：docker compose --profile init up minio-init
  minio-init:
    image: minio/mc:latest
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local "http://minio:9000" "${MINIO_ROOT_USER:-suiji}" "${MINIO_ROOT_PASSWORD:?未设置 MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/${MINIO_BUCKET:-suiji}"
    restart: on-failure

  api:
    build: .
    ports:
      # 只绑 127.0.0.1：直连 8000 会绕过 nginx 的日志脱敏与限流，对外一律走 nginx
      - "${API_PORT:-8000}:8000"
    logging: *default-logging
    environment:
      # 信任 nginx 的 X-Real-IP / X-Forwarded-For（限流键的真实来源）。
      # 部署在 nginx 之后必须为 1；若哪天直接暴露 api，必须改回 0。
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RL_REGISTER: ${RL_REGISTER:-5}
      RL_REGISTER_WINDOW: ${RL_REGISTER_WINDOW:-3600}
      RL_LOGIN: ${RL_LOGIN:-10}
      RL_LOGIN_WINDOW: ${RL_LOGIN_WINDOW:-300}
      RL_JOIN: ${RL_JOIN:-10}
      RL_JOIN_WINDOW: ${RL_JOIN_WINDOW:-300}
      RL_UPLOAD: ${RL_UPLOAD:-60}
      RL_UPLOAD_WINDOW: ${RL_UPLOAD_WINDOW:-300}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      MEDIA_URL_MAX_EXPIRES: ${MEDIA_URL_MAX_EXPIRES:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-suiji}:${POSTGRES_PASSWORD:?未设置 POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-suiji}
      # 启动时自动执行 Alembic 迁移（alembic upgrade head，判存幂等）；默认 0 不迁移
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
      REDIS_URL: redis://:${REDIS_PASSWORD:?未设置 REDIS_PASSWORD}@redis:6379/0
      # 不提供默认值兜底：未配置时 api 直接拒绝启动，杜绝用公开占位密钥签令牌
      JWT_SECRET: ${JWT_SECRET:?未设置 JWT_SECRET —— HS256 密钥泄露等于可以伪造任意用户令牌}
      MEDIA_DIR: /app/data/media
      MEDIA_BACKEND: ${MEDIA_BACKEND:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-suiji}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?未设置 MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-suiji}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MEDIA_URL_EXPIRES: ${MEDIA_URL_EXPIRES:-600}
      MEDIA_DOWNLOAD_MODE: ${MEDIA_DOWNLOAD_MODE:-auto}
      MEDIA_PATH_DATE_UTC: ${MEDIA_PATH_DATE_UTC:-0}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-209715200}
      # 外部依赖不可用时的降级开关：1=降级到本地实现，0=直接报错（容器部署一律 0）
      SUIJI_ALLOW_FALLBACK: ${SUIJI_ALLOW_FALLBACK:-0}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CRYPTO_MODE: ${CRYPTO_MODE:-optional}
      CRYPTO_KEY_FILE: /app/data/crypto/app_rsa_private.pem
      CRYPTO_TS_WINDOW: ${CRYPTO_TS_WINDOW:-300}
    volumes:
      - "${DATA_DIR:-./data}/media:/app/data/media"
      - "${DATA_DIR:-./data}/crypto:/app/data/crypto"
    # 镜像内以非 root 用户 suiji 运行（见 Dockerfile）。
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 统一入口反向代理：对外只需暴露 NGINX_PORT（默认 30080），转发规则见 nginx/templates/default.conf.template
  nginx:
    image: nginx:1.31.2-alpine
    environment:
      NGINX_LISTEN_PORT: ${NGINX_LISTEN_PORT:-80}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-200m}
      NGINX_ADMIN_ALLOW: ${NGINX_ADMIN_ALLOW:-127.0.0.1}
      NGINX_TLS_LISTEN_PORT: ${NGINX_TLS_LISTEN_PORT:-443}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
    ports:
      - "${NGINX_PORT:-30080}:${NGINX_LISTEN_PORT:-80}"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro"
      - "./static/suiji-website:/usr/share/nginx/html/suiji-website:ro"
      # 启用 HTTPS 时在覆盖文件或 env 中追加：
      # - "./nginx/templates/tls.conf.template:/etc/nginx/templates/tls.conf.template:ro"
      # - "/etc/letsencrypt/live/<你的域名>:/etc/nginx/certs:ro"
    logging: *default-logging
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${NGINX_LISTEN_PORT:-80}/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

# 数据统一落在 ${DATA_DIR:-./data} 下的 postgres / minio / media 子目录。
