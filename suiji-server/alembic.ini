[alembic]
script_location = alembic
prepend_sys_path = .
# NOTE: keep this file ASCII-only. Alembic reads it with encoding="locale"
# (system ANSI code page, e.g. GBK on Chinese Windows) and crashes on non-ASCII.
# The real DSN is taken from DATABASE_URL by alembic/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
